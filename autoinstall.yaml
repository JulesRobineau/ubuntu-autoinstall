#cloud-config
# =============================================================================
# Ubuntu 26.04 Desktop - Autoinstall (variante Lenovo : client remote vers le Legion)
# Reproduit l'environnement de Jules (GNOME minimal/dark, dev Go/DevSecOps).
#
# Sections :
#   autoinstall.*            -> exécuté par l'installeur (Subiquity)
#   autoinstall.user-data    -> cloud-init, joué au PREMIER BOOT du système installé
#                               (réseau dispo) : dépôts, apps, dconf, zsh, fonts...
#
# AVANT USAGE :
#   1. Mot de passe : rien à faire, l'installeur le demande (section identity interactive)
#   2. Adapter hostname / username / locale / clavier si besoin
#   3. Voir README.md pour fabriquer le média d'installation
# =============================================================================
autoinstall:
  version: 1

  # Tout est non-interactif SAUF la création d'utilisateur (saisie manuelle).
  interactive-sections:
    - identity

  # Image desktop minimale (ajoute le bureau GNOME sans la suite bureautique)
  source:
    id: ubuntu-desktop-minimal
    search_drivers: true

  locale: fr_FR.UTF-8
  keyboard:
    layout: fr

  # Pilotes proprio (NVIDIA sur le Legion) + codecs multimédia
  drivers:
    install: true
  codecs:
    install: true

  # Pas de bloc identity : le schéma exige un password, on n'en stocke pas.
  # L'installeur demande tout à la main. Username OBLIGATOIREMENT "jules"
  # (le script de setup s'appuie dessus).

  ssh:
    install-server: false

  # ---- Paquets disponibles dans les dépôts Ubuntu (main/universe) ----
  packages:
    - zsh
    - git
    - curl
    - wget
    - unzip
    - gnome-tweaks
    - gnome-shell-extension-manager
    - fonts-inter
    - fonts-jetbrains-mono
    - pipx            # pour installer gnome-extensions-cli (gext)
    - apt-transport-https
    - ca-certificates
    - remmina                      # client RDP vers le Legion
    - remmina-plugin-rdp

  # ---- Snaps (on reste minimal ; tout le reste passe par .deb/dépôts apt) ----
  snaps: []

  # ---- Toute la customisation post-install : cloud-init au 1er boot ----
  user-data:
    # Fichiers déposés tels quels sur le système installé
    write_files:
      # ---------- Profil dconf système (réglages GNOME par défaut) ----------
      - path: /etc/dconf/profile/user
        content: |
          user-db:user
          system-db:local

      - path: /etc/dconf/db/local.d/00-jules
        content: |
          [org/gnome/desktop/interface]
          color-scheme='prefer-dark'
          icon-theme='Tela-dark'
          font-name='Inter 11'
          monospace-font-name='JetBrainsMono Nerd Font 11'
          clock-show-seconds=true
          clock-show-weekday=true
          clock-show-date=true
          gtk-enable-primary-paste=true

          [org/gnome/desktop/a11y/applications]
          screen-reader-enabled=false

          [org/gnome/shell/extensions/dash-to-dock]
          dock-fixed=false
          autohide=true
          intellihide=true

          [org/gnome/shell/extensions/just-perfection]
          accessibility-menu=false

          [org/gnome/shell/extensions/vitals]
          show-processor=true
          show-memory=true
          show-network=true
          show-temperature=false
          show-voltage=false
          show-fan=false
          show-storage=false
          show-system=false
          show-battery=false
          update-time=3
          position-in-panel=2
          hot-sensors=['_processor_usage_', '_memory_usage_']

          [org/gnome/Ptyxis]
          use-system-font=false
          font-name='JetBrainsMono Nerd Font 12'
          interface-style='dark'

      # ---------- Prompt Starship (deux lignes, minimal, dev) ----------
      - path: /home/jules/.config/starship.toml
        owner: jules:jules
        permissions: '0644'
        content: |
          format = """
          [╭─](bold blue) $directory$git_branch$git_status$golang$nodejs$docker_context$kubernetes
          [╰─](bold blue)$character """
          add_newline = true

          [character]
          success_symbol = "[❯](bold green)"
          error_symbol = "[❯](bold red)"

          [directory]
          style = "bold cyan"
          truncation_length = 4
          truncate_to_repo = false

          [git_branch]
          symbol = " "
          style = "bold purple"
          format = "on [$symbol$branch]($style) "

          [git_status]
          style = "bold yellow"
          format = "([$all_status$ahead_behind]($style) )"

          [golang]
          symbol = " "
          style = "bold cyan"
          format = "via [$symbol($version)]($style) "

          [docker_context]
          symbol = " "
          style = "bold blue"
          format = "via [$symbol$context]($style) "

          [kubernetes]
          disabled = false
          symbol = "󱃾 "
          style = "bold blue"
          format = "on [$symbol$context]($style) "
          detect_files = ['Chart.yaml', 'skaffold.yaml', 'kustomization.yaml']
          detect_folders = ['k8s', 'kubernetes', 'helm']

      # ---------- .zshrc (oh-my-zsh + starship + PATH dev) ----------
      - path: /home/jules/.zshrc
        owner: jules:jules
        permissions: '0644'
        content: |
          export ZSH="$HOME/.oh-my-zsh"
          ZSH_THEME=""   # remplacé par Starship
          export DISABLE_MAGIC_FUNCTIONS="true"
          export DISABLE_UNTRACKED_FILES_DIRTY="true"
          plugins=(git docker golang kubectl web-search zsh-autosuggestions zsh-syntax-highlighting)
          source $ZSH/oh-my-zsh.sh

          export PATH=$PATH:$HOME/bin:$HOME/go/bin:$HOME/.local/bin:/usr/local/go/bin

          # Secrets : NE PAS mettre en clair ici. Sourcer un fichier non-versionné :
          [ -f "$HOME/.secrets" ] && source "$HOME/.secrets"

          # Starship prompt
          eval "$(starship init zsh)"

      # ---------- Override .desktop : Lens en X11 (fix Electron/Wayland) ----------
      - path: /home/jules/.local/share/applications/lens-desktop.desktop
        owner: jules:jules
        permissions: '0644'
        content: |
          [Desktop Entry]
          Name=Lens
          Exec=/opt/Lens/lens-desktop --ozone-platform-hint=auto %U
          Terminal=false
          Type=Application
          Icon=lens-desktop
          StartupWMClass=lens
          Comment=Lens - The way the world runs Kubernetes
          MimeType=x-scheme-handler/lens;
          Categories=Network;Development;

      # ---------- Override .desktop : Slack en X11 (fix Electron/Wayland) ----------
      - path: /home/jules/.local/share/applications/slack.desktop
        owner: jules:jules
        permissions: '0644'
        content: |
          [Desktop Entry]
          Name=Slack
          Exec=/usr/bin/slack --ozone-platform=x11 %U
          Terminal=false
          Type=Application
          Icon=slack
          StartupWMClass=Slack
          Comment=Slack Desktop
          MimeType=x-scheme-handler/slack;
          Categories=Network;InstantMessaging;

      # ---------- Override .desktop : Obsidian en X11 (fix Electron/Wayland) ----------
      - path: /home/jules/.local/share/applications/obsidian.desktop
        owner: jules:jules
        permissions: '0644'
        content: |
          [Desktop Entry]
          Name=Obsidian
          Exec=/opt/Obsidian/obsidian --ozone-platform=x11 %u
          Terminal=false
          Type=Application
          Icon=obsidian
          StartupWMClass=obsidian
          Comment=Obsidian
          MimeType=x-scheme-handler/obsidian;
          Categories=Office;

      # ---------- Script de personnalisation (lancé une fois au 1er boot) ----------
      - path: /usr/local/sbin/jules-setup.sh
        permissions: '0755'
        content: |
          #!/usr/bin/env bash
          # Setup post-install : dépôts tiers, apps, fonts, icônes, zsh, extensions.
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          USER_NAME=jules
          USER_HOME=/home/$USER_NAME
          install -d -m 0755 /etc/apt/keyrings

          # ---- Dépôts apt tiers (clé + source) ----
          # Google Chrome
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
            | gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
            > /etc/apt/sources.list.d/google-chrome.list

          # Spotify (clé de signature courante, vérifier si elle a tourné)
          curl -fsSL https://download.spotify.com/debian/pubkey_5384CE82BA52C83A.gpg \
            | gpg --dearmor -o /etc/apt/keyrings/spotify.gpg
          echo "deb [signed-by=/etc/apt/keyrings/spotify.gpg] https://repository.spotify.com stable non-free" \
            > /etc/apt/sources.list.d/spotify.list

          # Kubernetes Lens
          curl -fsSL https://downloads.k8slens.dev/keys/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/lens.gpg
          echo "deb [signed-by=/etc/apt/keyrings/lens.gpg] https://downloads.k8slens.dev/apt/debian stable main" \
            > /etc/apt/sources.list.d/lens.list

          # NetBird (VPN)
          curl -fsSL https://pkgs.netbird.io/debian/public.key \
            | gpg --dearmor -o /etc/apt/keyrings/netbird.gpg
          echo "deb [signed-by=/etc/apt/keyrings/netbird.gpg] https://pkgs.netbird.io/debian stable main" \
            > /etc/apt/sources.list.d/netbird.list

          # Visual Studio Code (dépôt Microsoft)
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | gpg --dearmor -o /etc/apt/keyrings/microsoft.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/code stable main" \
            > /etc/apt/sources.list.d/vscode.list

          apt-get update -y
          apt-get install -y google-chrome-stable spotify-client lens netbird netbird-ui code

          # ---- Apps en .deb direct ----
          TMP=$(mktemp -d)
          # Discord (deb bootstrap officiel, télécharge l'app au 1er lancement)
          curl -fsSL -o "$TMP/discord.deb" "https://discord.com/api/download?platform=linux&format=deb" || true
          # Slack (version pinnée - à mettre à jour : https://slack.com/downloads/linux)
          curl -fsSL -o "$TMP/slack.deb" \
            "https://downloads.slack-edge.com/desktop-releases/linux/x64/4.49.89/slack-desktop-4.49.89-amd64.deb" || true
          # Obsidian (version pinnée - à mettre à jour : https://github.com/obsidianmd/obsidian-releases/releases)
          curl -fsSL -o "$TMP/obsidian.deb" \
            "https://github.com/obsidianmd/obsidian-releases/releases/download/v1.12.7/obsidian_1.12.7_amd64.deb" || true
          apt-get install -y "$TMP/discord.deb" "$TMP/slack.deb" "$TMP/obsidian.deb" || true
          rm -rf "$TMP"

          # ---- Tailscale (accès au Legion) ; `sudo tailscale up` à faire à la main ----
          curl -fsSL https://tailscale.com/install.sh | sh

          # ---- Starship (prompt) ----
          curl -fsSL https://starship.rs/install.sh | sh -s -- -y -b /usr/local/bin

          # ---- JetBrainsMono Nerd Font (système) ----
          install -d /usr/local/share/fonts
          curl -fsSL -o /tmp/JBM.zip \
            https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.zip
          unzip -oq /tmp/JBM.zip -d /usr/local/share/fonts/JetBrainsMonoNerd
          rm -f /tmp/JBM.zip
          fc-cache -f

          # ---- Icônes Tela (système) ----
          git clone --depth 1 https://github.com/vinceliuice/Tela-icon-theme.git /tmp/Tela
          /tmp/Tela/install.sh -a -d /usr/share/icons
          rm -rf /tmp/Tela

          # ---- Slack : handler par défaut slack:// (évite un prompt) ----
          # (sur deb, pas de bug snapd ; on garde quand même la cohérence)

          # ---- dconf : appliquer les réglages GNOME système ----
          dconf update

          # ---- Shell par défaut zsh + oh-my-zsh + plugins ----
          chsh -s /usr/bin/zsh "$USER_NAME"
          if [ ! -d "$USER_HOME/.oh-my-zsh" ]; then
            sudo -u "$USER_NAME" git clone --depth 1 https://github.com/ohmyzsh/ohmyzsh.git "$USER_HOME/.oh-my-zsh"
          fi
          ZC="$USER_HOME/.oh-my-zsh/custom/plugins"
          sudo -u "$USER_NAME" git clone --depth 1 https://github.com/zsh-users/zsh-autosuggestions "$ZC/zsh-autosuggestions" || true
          sudo -u "$USER_NAME" git clone --depth 1 https://github.com/zsh-users/zsh-syntax-highlighting "$ZC/zsh-syntax-highlighting" || true

          # ---- Extensions GNOME (via gext, qui matche la version du shell) ----
          sudo -u "$USER_NAME" pipx install gnome-extensions-cli || true
          for uuid in \
            dash-to-dock@micxgx.gmail.com \
            blur-my-shell@aunetx \
            just-perfection-desktop@just-perfection \
            Vitals@CoreCoding.com ; do
            sudo -u "$USER_NAME" "$USER_HOME/.local/bin/gext" install "$uuid" || true
          done

          # ---- Désactiver le dock natif (évite le double dock) ----
          sudo -u "$USER_NAME" mkdir -p "$USER_HOME/.config/autostart"

          # S'assurer que tout ce qui est sous /home/jules appartient à jules
          chown -R "$USER_NAME:$USER_NAME" "$USER_HOME/.config" "$USER_HOME/.local" 2>/dev/null || true

          # Auto-désactivation : ce service ne tourne qu'une fois
          systemctl disable jules-setup.service || true
          touch /var/lib/jules-setup.done

      # ---------- Service systemd one-shot qui lance le script ci-dessus ----------
      - path: /etc/systemd/system/jules-setup.service
        content: |
          [Unit]
          Description=Personnalisation post-install (Jules)
          After=network-online.target
          Wants=network-online.target
          ConditionPathExists=!/var/lib/jules-setup.done

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/jules-setup.sh
          RemainAfterExit=yes
          TimeoutStartSec=900

          [Install]
          WantedBy=multi-user.target

    # Activer le service de setup au 1er boot
    runcmd:
      - [ systemctl, enable, jules-setup.service ]
